<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<title>Todo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <header>
    <h1>Today</h1>
    <p id="count" class="count"></p>
  </header>

  <form id="new">
    <input id="text" placeholder="What needs doing?" required autocomplete="off" aria-label="New task">
    <button aria-label="Add task">Add</button>
  </form>

  <ul id="list"></ul>
  <p id="empty" class="empty" hidden>Nothing here yet — add your first task above.</p>
</main>
<script src="app.js"></script>
</body>
</html>
